<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Oswald:wght@400;500;600;700&family=DM+Mono:wght@400;500&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#07060C; color:#F4EFE4; font-family:Archivo, system-ui, sans-serif; padding:48px; display:flex; }
  @keyframes rb-pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .rb-scroll::-webkit-scrollbar { width: 0; height: 0 }
  .rb-scroll { scrollbar-width: none }
</style></head><body>
<div style="display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;"><span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .12em; padding: 4px 9px; background: #FFD23F; color: #170B22;">15</span><span style="font-size: 16px; font-weight: 700;">Share</span></div>
      <div style="width: 402px; height: 868px; border-radius: 52px; overflow: hidden; position: relative; background: #170B22; box-shadow: 0 50px 100px -30px rgba(0,0,0,.75), 0 0 0 1px rgba(255,255,255,.08);">
        <div style="position: absolute; inset: 0; z-index: 0; pointer-events: none; background-image: radial-gradient(rgba(255,46,136,.22) 1px, transparent 1.3px); background-size: 4px 4px;"></div>
        <div style="position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 122px; height: 35px; border-radius: 22px; background: #0C0512; z-index: 90;"></div>
        <div class="rb-scroll" style="position: absolute; inset: 0; z-index: 20; overflow-y: auto; overflow-x: hidden; padding: 62px 18px 40px;">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 18px;">
            <span style="width: 38px; height: 38px; display: grid; place-items: center; background: #0F0618; box-shadow: inset 0 0 0 1.5px rgba(241,232,214,.25); color: #F1E8D6;"><svg viewBox="0 0 24 24" fill="none" width="18" height="18"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
            <span style="font-family: Bevan, serif; font-size: 24px; text-transform: uppercase; color: #F1E8D6; text-shadow: -2px 0 0 #FF2E88, 2px 0 0 #35F0E0;">Share</span>
          </div>
          <div style="padding: 18px 16px; margin: 0 3px 14px 0; background: #120A1B; box-shadow: 5px 5px 0 #FF6A1F, 0 0 60px -14px rgba(255,46,136,.5);">
            <div style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #35F0E0;">Live round</div>
            <div style="font-family: Bevan, serif; font-size: 26px; line-height: 1.1; text-transform: uppercase; color: #F1E8D6; margin: 10px 0 8px; text-shadow: -2px 0 0 #FF2E88, 2px 0 0 #35F0E0;">20.50 SOL prize pool</div>
            <p style="margin: 0; font-family: Archivo, sans-serif; font-size: 13.5px; line-height: 1.5; color: #A88FBF;">Tyche #0142 is live with 20.50 SOL in the visible prize pool and 12 community rules.</p>
          </div>
          <div style="padding: 15px 16px; margin: 0 3px 16px 0; background: #0F0618; box-shadow: inset 0 0 0 1.5px rgba(255,210,63,.35);">
            <div style="font-family: Oswald, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: #FFD23F;">Elected rule</div>
            <div style="font-family: Bevan, serif; font-size: 19px; text-transform: uppercase; color: #F1E8D6; margin: 8px 0 6px;">Closest Sum</div>
            <p style="margin: 0; font-family: Archivo, sans-serif; font-size: 13px; line-height: 1.5; color: #A88FBF;">The guess whose sum is nearest to 100 wins the alternative pool.</p>
          </div>
          <div style="display: grid; gap: 10px;">
            <button style="width: 100%; padding: 14px; margin-right: 3px; border: none; border-radius: 22px; background: #FFD23F; color: #170B22; font-family: Bevan, serif; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; box-shadow: 5px 5px 0 #FF6A1F;">Share round</button>
            <button style="width: 100%; padding: 14px; border: none; background: transparent; color: #F1E8D6; font-family: Oswald, sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; border-radius: 999px; box-shadow: inset 0 0 0 1.5px rgba(53,240,224,.5), 0 0 34px -10px rgba(53,240,224,.55), 0 0 66px -18px rgba(53,240,224,.4);">Copy public link</button>
          </div>
        </div>
      </div>
    </div>
</body></html>
