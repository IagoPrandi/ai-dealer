name: idealer

services:
  postgres:
    image: postgres:18.1-alpine
    container_name: idealer-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idealer_dev}
      POSTGRES_USER: ${POSTGRES_USER:-idealer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idealer_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - idealer-internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - idealer-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.4.0-alpine
    container_name: idealer-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - idealer-internal
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - idealer-redis-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: idealer-api
    profiles: ["containerized"]
    command: ["pnpm", "--filter", "@idealer/api", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-idealer}:${POSTGRES_PASSWORD:-idealer_dev_password}@postgres:5432/${POSTGRES_DB:-idealer_dev}
      REDIS_URL: redis://redis:6379
      OPERATOR_AI_CONSOLE_AUTHORIZED_WALLETS: ${OPERATOR_AI_CONSOLE_AUTHORIZED_WALLETS:-}
      IDEALER_DEVNET_TURN_DURATION_SCALE_BPS: ${IDEALER_DEVNET_TURN_DURATION_SCALE_BPS:-1500}
      LLM_MODE: ${LLM_MODE:-local}
      LLM_BASE_URL: ${LLM_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:latest}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      LLM_SEED: ${LLM_SEED:-7}
      # `-` (not `:-`) so an explicitly empty value in .env disables the feature;
      # the default only applies when the var is entirely unset.
      LLM_GUARDIAN_MODEL: ${LLM_GUARDIAN_MODEL-granite4.1-guardian:8b}
      LLM_GUARDIAN_TIMEOUT_MS: ${LLM_GUARDIAN_TIMEOUT_MS:-120000}
      LLM_ESCALATION_MODEL: ${LLM_ESCALATION_MODEL-gemma4:e2b}
      LLM_TRANSLATE_TO_ENGLISH: ${LLM_TRANSLATE_TO_ENGLISH:-true}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-local-openai-compatible}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemma4:latest}
      LLM_PRIMARY_MODEL_DIGEST: ${LLM_PRIMARY_MODEL_DIGEST:-}
      LLM_PRIMARY_MODEL_QUANTIZATION: ${LLM_PRIMARY_MODEL_QUANTIZATION:-q4_K_M}
      LLM_PRIMARY_SERVING_ENGINE: ${LLM_PRIMARY_SERVING_ENGINE:-ollama}
      LLM_SECONDARY_PROVIDER: ${LLM_SECONDARY_PROVIDER:-openai}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_CONTAINER_BASE_URL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-gpt-4.1-mini}
      LLM_SECONDARY_MODEL_DIGEST: ${LLM_SECONDARY_MODEL_DIGEST:-}
      LLM_SECONDARY_MODEL_QUANTIZATION: ${LLM_SECONDARY_MODEL_QUANTIZATION:-}
      LLM_SECONDARY_SERVING_ENGINE: ${LLM_SECONDARY_SERVING_ENGINE:-openai}
      LLM_SECONDARY_LOCAL: ${LLM_SECONDARY_LOCAL:-false}
      LLM_TERTIARY_PROVIDER: ${LLM_TERTIARY_PROVIDER:-anthropic}
      LLM_TERTIARY_BASE_URL: ${LLM_TERTIARY_CONTAINER_BASE_URL:-}
      LLM_TERTIARY_MODEL: ${LLM_TERTIARY_MODEL:-claude-3-5-sonnet}
      LLM_TERTIARY_MODEL_DIGEST: ${LLM_TERTIARY_MODEL_DIGEST:-}
      LLM_TERTIARY_MODEL_QUANTIZATION: ${LLM_TERTIARY_MODEL_QUANTIZATION:-}
      LLM_TERTIARY_SERVING_ENGINE: ${LLM_TERTIARY_SERVING_ENGINE:-anthropic}
      LLM_TERTIARY_LOCAL: ${LLM_TERTIARY_LOCAL:-false}
      LLM_PROVIDER_KEYS: ${LLM_PROVIDER_KEYS:-}
      LLM_MODEL_COMPILE: ${LLM_MODEL_COMPILE:-}
      LLM_MODEL_INTERPRET: ${LLM_MODEL_INTERPRET:-}
      LLM_MODEL_NORMALIZE: ${LLM_MODEL_NORMALIZE:-}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-}
      LLM_MODEL_REVIEW: ${LLM_MODEL_REVIEW:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - idealer-internal
    ports:
      - "${API_PORT:-3002}:3002"
    volumes:
      - ./apps/api/src:/app/apps/api/src

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: idealer-worker
    profiles: ["containerized"]
    command: ["pnpm", "--filter", "@idealer/worker", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-idealer}:${POSTGRES_PASSWORD:-idealer_dev_password}@postgres:5432/${POSTGRES_DB:-idealer_dev}
      REDIS_URL: redis://redis:6379
      IDEALER_SOLANA_RPC_URL: ${IDEALER_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      IDEALER_PROGRAM_ID: ${IDEALER_PROGRAM_ID:-ExW6LBU6XWsP53cvbtV1N2KFYMaudCtrenimHNWBBENd}
      IDEALER_TURN_AUTOMATION_ENABLED: ${IDEALER_TURN_AUTOMATION_ENABLED:-true}
      IDEALER_TURN_AUTOMATION_INTERVAL_MS: ${IDEALER_TURN_AUTOMATION_INTERVAL_MS:-10000}
      # TEST-ONLY manual turn control (POST /manual/open|close|cycle on the worker).
      # Keep disabled in production; the automatic loop above advances turns there.
      IDEALER_TURN_MANUAL_CONTROL_ENABLED: ${IDEALER_TURN_MANUAL_CONTROL_ENABLED:-false}
      IDEALER_TURN_MANUAL_OPEN_DURATION_SECONDS: ${IDEALER_TURN_MANUAL_OPEN_DURATION_SECONDS:-3600}
      IDEALER_DEVNET_TURN_DURATION_SCALE_BPS: ${IDEALER_DEVNET_TURN_DURATION_SCALE_BPS:-1500}
      IDEALER_TURN_AUTHORITY_KEYPAIR_PATH: ${IDEALER_TURN_AUTHORITY_KEYPAIR_PATH:-/solana-home/.config/idealer/devnet/idealer-deployer-keypair.json}
      IDEALER_TURN_AUTHORITY_KEYPAIR: ${IDEALER_TURN_AUTHORITY_KEYPAIR:-}
      # M5.3 settlement scheduler (OFF by default; turn automation defers close to
      # it when enabled). The API base URL points at the in-network API service.
      IDEALER_SETTLEMENT_AUTOMATION_ENABLED: ${IDEALER_SETTLEMENT_AUTOMATION_ENABLED:-false}
      IDEALER_SETTLEMENT_AUTOMATION_INTERVAL_MS: ${IDEALER_SETTLEMENT_AUTOMATION_INTERVAL_MS:-30000}
      IDEALER_SETTLEMENT_MAX_STEPS_PER_TICK: ${IDEALER_SETTLEMENT_MAX_STEPS_PER_TICK:-10}
      IDEALER_API_BASE_URL: ${IDEALER_API_BASE_URL:-http://api:3002}
      IDEALER_ELECTION_TOP_VOTED_FINALISTS: ${IDEALER_ELECTION_TOP_VOTED_FINALISTS:-3}
      IDEALER_ELECTION_RANDOM_FINALISTS: ${IDEALER_ELECTION_RANDOM_FINALISTS:-7}
      LLM_MODE: ${LLM_MODE:-local}
      LLM_BASE_URL: ${LLM_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:latest}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      LLM_SEED: ${LLM_SEED:-7}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-local-openai-compatible}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemma4:latest}
      LLM_PRIMARY_MODEL_DIGEST: ${LLM_PRIMARY_MODEL_DIGEST:-}
      LLM_PRIMARY_MODEL_QUANTIZATION: ${LLM_PRIMARY_MODEL_QUANTIZATION:-q4_K_M}
      LLM_PRIMARY_SERVING_ENGINE: ${LLM_PRIMARY_SERVING_ENGINE:-ollama}
      LLM_SECONDARY_PROVIDER: ${LLM_SECONDARY_PROVIDER:-openai}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_CONTAINER_BASE_URL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-gpt-4.1-mini}
      LLM_SECONDARY_MODEL_DIGEST: ${LLM_SECONDARY_MODEL_DIGEST:-}
      LLM_SECONDARY_MODEL_QUANTIZATION: ${LLM_SECONDARY_MODEL_QUANTIZATION:-}
      LLM_SECONDARY_SERVING_ENGINE: ${LLM_SECONDARY_SERVING_ENGINE:-openai}
      LLM_SECONDARY_LOCAL: ${LLM_SECONDARY_LOCAL:-false}
      LLM_TERTIARY_PROVIDER: ${LLM_TERTIARY_PROVIDER:-anthropic}
      LLM_TERTIARY_BASE_URL: ${LLM_TERTIARY_CONTAINER_BASE_URL:-}
      LLM_TERTIARY_MODEL: ${LLM_TERTIARY_MODEL:-claude-3-5-sonnet}
      LLM_TERTIARY_MODEL_DIGEST: ${LLM_TERTIARY_MODEL_DIGEST:-}
      LLM_TERTIARY_MODEL_QUANTIZATION: ${LLM_TERTIARY_MODEL_QUANTIZATION:-}
      LLM_TERTIARY_SERVING_ENGINE: ${LLM_TERTIARY_SERVING_ENGINE:-anthropic}
      LLM_TERTIARY_LOCAL: ${LLM_TERTIARY_LOCAL:-false}
      LLM_PROVIDER_KEYS: ${LLM_PROVIDER_KEYS:-}
      LLM_MODEL_COMPILE: ${LLM_MODEL_COMPILE:-}
      LLM_MODEL_INTERPRET: ${LLM_MODEL_INTERPRET:-}
      LLM_MODEL_NORMALIZE: ${LLM_MODEL_NORMALIZE:-}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-}
      LLM_MODEL_REVIEW: ${LLM_MODEL_REVIEW:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - idealer-internal
    ports:
      - "${WORKER_PORT:-3003}:3003"
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      - idealer-solana-home:/solana-home:ro

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: idealer-web
    profiles: ["containerized"]
    command: ["pnpm", "--filter", "@idealer/web", "dev"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      IDEALER_API_PROXY_TARGET: http://api:3002
      IDEALER_WORKER_PROXY_TARGET: http://worker:3003
      NEXT_PUBLIC_IDEALER_API_URL: /__api
      NEXT_PUBLIC_IDEALER_WORKER_URL: /__worker
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - idealer-internal
    ports:
      - "${WEB_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: idealer-admin
    command: ["pnpm", "--filter", "@idealer/admin", "dev"]
    profiles: ["containerized"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_IDEALER_API_URL: http://localhost:3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - idealer-internal
    ports:
      - "${ADMIN_PORT:-3001}:3001"

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: idealer-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - idealer-internal
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.4.0
    container_name: idealer-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - idealer-internal
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    volumes:
      - idealer-grafana-data:/var/lib/grafana

  mailpit:
    image: axllent/mailpit:v1.28.0
    container_name: idealer-mailpit
    profiles: ["mail"]
    networks:
      - idealer-internal
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

networks:
  idealer-internal:
    name: idealer-internal

volumes:
  idealer-postgres-data:
    external: true
    name: idealer-postgres-data
  idealer-redis-data:
    external: true
    name: idealer-redis-data
  idealer-grafana-data:
    name: idealer-grafana-data
  idealer-solana-home:
    external: true
    name: idealer-solana-home
