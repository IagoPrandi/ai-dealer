name: tyche

services:
  postgres:
    image: postgres:18.1-alpine
    container_name: tyche-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tyche_dev}
      POSTGRES_USER: ${POSTGRES_USER:-tyche}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tyche_dev_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - tyche-internal
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tyche-postgres-data:/var/lib/postgresql

  redis:
    image: redis:8.4.0-alpine
    container_name: tyche-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - tyche-internal
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - tyche-redis-data:/data

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: tyche-api
    profiles: ["containerized"]
    command: ["pnpm", "--filter", "@tyche/api", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-tyche}:${POSTGRES_PASSWORD:-tyche_dev_password}@postgres:5432/${POSTGRES_DB:-tyche_dev}
      REDIS_URL: redis://redis:6379
      OPERATOR_AI_CONSOLE_AUTHORIZED_WALLETS: ${OPERATOR_AI_CONSOLE_AUTHORIZED_WALLETS:-}
      TYCHE_DEVNET_TURN_DURATION_SCALE_BPS: ${TYCHE_DEVNET_TURN_DURATION_SCALE_BPS:-1500}
      LLM_MODE: ${LLM_MODE:-local}
      LLM_BASE_URL: ${LLM_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:latest}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      LLM_SEED: ${LLM_SEED:-7}
      # `-` (not `:-`) so an explicitly empty value in .env disables the feature;
      # the default only applies when the var is entirely unset.
      LLM_GUARDIAN_MODEL: ${LLM_GUARDIAN_MODEL-granite4.1-guardian:8b}
      LLM_GUARDIAN_TIMEOUT_MS: ${LLM_GUARDIAN_TIMEOUT_MS:-120000}
      LLM_ESCALATION_MODEL: ${LLM_ESCALATION_MODEL-}
      LLM_TRANSLATE_TO_ENGLISH: ${LLM_TRANSLATE_TO_ENGLISH:-false}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-local-openai-compatible}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemma4:latest}
      LLM_PRIMARY_MODEL_DIGEST: ${LLM_PRIMARY_MODEL_DIGEST:-}
      LLM_PRIMARY_MODEL_QUANTIZATION: ${LLM_PRIMARY_MODEL_QUANTIZATION:-q4_K_M}
      LLM_PRIMARY_SERVING_ENGINE: ${LLM_PRIMARY_SERVING_ENGINE:-ollama}
      LLM_SECONDARY_PROVIDER: ${LLM_SECONDARY_PROVIDER:-openai}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_CONTAINER_BASE_URL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-gpt-4.1-mini}
      LLM_SECONDARY_MODEL_DIGEST: ${LLM_SECONDARY_MODEL_DIGEST:-}
      LLM_SECONDARY_MODEL_QUANTIZATION: ${LLM_SECONDARY_MODEL_QUANTIZATION:-}
      LLM_SECONDARY_SERVING_ENGINE: ${LLM_SECONDARY_SERVING_ENGINE:-openai}
      LLM_SECONDARY_LOCAL: ${LLM_SECONDARY_LOCAL:-false}
      LLM_TERTIARY_PROVIDER: ${LLM_TERTIARY_PROVIDER:-anthropic}
      LLM_TERTIARY_BASE_URL: ${LLM_TERTIARY_CONTAINER_BASE_URL:-}
      LLM_TERTIARY_MODEL: ${LLM_TERTIARY_MODEL:-claude-3-5-sonnet}
      LLM_TERTIARY_MODEL_DIGEST: ${LLM_TERTIARY_MODEL_DIGEST:-}
      LLM_TERTIARY_MODEL_QUANTIZATION: ${LLM_TERTIARY_MODEL_QUANTIZATION:-}
      LLM_TERTIARY_SERVING_ENGINE: ${LLM_TERTIARY_SERVING_ENGINE:-anthropic}
      LLM_TERTIARY_LOCAL: ${LLM_TERTIARY_LOCAL:-false}
      LLM_PROVIDER_KEYS: ${LLM_PROVIDER_KEYS:-}
      LLM_MODEL_COMPILE: ${LLM_MODEL_COMPILE:-}
      LLM_MODEL_INTERPRET: ${LLM_MODEL_INTERPRET:-}
      LLM_MODEL_NORMALIZE: ${LLM_MODEL_NORMALIZE:-}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-}
      LLM_MODEL_REVIEW: ${LLM_MODEL_REVIEW:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tyche-internal
    ports:
      - "${API_PORT:-3002}:3002"
    volumes:
      - ./apps/api/src:/app/apps/api/src

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: tyche-worker
    profiles: ["containerized"]
    command: ["pnpm", "--filter", "@tyche/worker", "dev"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-tyche}:${POSTGRES_PASSWORD:-tyche_dev_password}@postgres:5432/${POSTGRES_DB:-tyche_dev}
      REDIS_URL: redis://redis:6379
      TYCHE_SOLANA_RPC_URL: ${TYCHE_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      TYCHE_PROGRAM_ID: ${TYCHE_PROGRAM_ID:-ExW6LBU6XWsP53cvbtV1N2KFYMaudCtrenimHNWBBENd}
      TYCHE_TURN_AUTOMATION_ENABLED: ${TYCHE_TURN_AUTOMATION_ENABLED:-true}
      TYCHE_TURN_AUTOMATION_INTERVAL_MS: ${TYCHE_TURN_AUTOMATION_INTERVAL_MS:-10000}
      # TEST-ONLY manual turn control (POST /manual/open|close|cycle on the worker).
      # Keep disabled in production; the automatic loop above advances turns there.
      TYCHE_TURN_MANUAL_CONTROL_ENABLED: ${TYCHE_TURN_MANUAL_CONTROL_ENABLED:-false}
      TYCHE_TURN_MANUAL_OPEN_DURATION_SECONDS: ${TYCHE_TURN_MANUAL_OPEN_DURATION_SECONDS:-3600}
      TYCHE_DEVNET_TURN_DURATION_SCALE_BPS: ${TYCHE_DEVNET_TURN_DURATION_SCALE_BPS:-1500}
      TYCHE_TURN_AUTHORITY_KEYPAIR_PATH: ${TYCHE_TURN_AUTHORITY_KEYPAIR_PATH:-/solana-home/.config/tyche/devnet/tyche-deployer-keypair.json}
      TYCHE_TURN_AUTHORITY_KEYPAIR: ${TYCHE_TURN_AUTHORITY_KEYPAIR:-}
      # M5.3 settlement scheduler (OFF by default; turn automation defers close to
      # it when enabled). The API base URL points at the in-network API service.
      TYCHE_SETTLEMENT_AUTOMATION_ENABLED: ${TYCHE_SETTLEMENT_AUTOMATION_ENABLED:-false}
      TYCHE_SETTLEMENT_AUTOMATION_INTERVAL_MS: ${TYCHE_SETTLEMENT_AUTOMATION_INTERVAL_MS:-30000}
      TYCHE_SETTLEMENT_MAX_STEPS_PER_TICK: ${TYCHE_SETTLEMENT_MAX_STEPS_PER_TICK:-10}
      # Phase-1 proposals must be precompiled before they become eligible for
      # election. Keep the loop explicitly configurable in container mode.
      TYCHE_RULE_PRECOMPILE_ENABLED: ${TYCHE_RULE_PRECOMPILE_ENABLED:-false}
      TYCHE_RULE_PRECOMPILE_INTERVAL_MS: ${TYCHE_RULE_PRECOMPILE_INTERVAL_MS:-15000}
      # M10 campaign action-reward settlement. Keep OFF until the reviewed
      # Tyche artifact containing the Tokenomics Core CPI is deployed.
      TYCHE_TOKEN_REWARD_SETTLEMENT_ENABLED: ${TYCHE_TOKEN_REWARD_SETTLEMENT_ENABLED:-false}
      TYCHE_TOKEN_REWARD_SETTLEMENT_INTERVAL_MS: ${TYCHE_TOKEN_REWARD_SETTLEMENT_INTERVAL_MS:-30000}
      TYCHE_TOKEN_REWARD_MAX_PER_PASS: ${TYCHE_TOKEN_REWARD_MAX_PER_PASS:-20}
      TYCHE_TOKEN_REWARD_ACTION_ALLOWLIST: ${TYCHE_TOKEN_REWARD_ACTION_ALLOWLIST:-}
      TYCHE_ACTIVE_RULE_REWARD_SETTLEMENT_ENABLED: ${TYCHE_ACTIVE_RULE_REWARD_SETTLEMENT_ENABLED:-false}
      TYCHE_ACTIVE_RULE_REWARD_SETTLEMENT_INTERVAL_MS: ${TYCHE_ACTIVE_RULE_REWARD_SETTLEMENT_INTERVAL_MS:-30000}
      TYCHE_ACTIVE_RULE_REWARD_TURN_ALLOWLIST: ${TYCHE_ACTIVE_RULE_REWARD_TURN_ALLOWLIST:-}
      TYCHE_ACTIVE_RULE_REWARD_BROADCAST: ${TYCHE_ACTIVE_RULE_REWARD_BROADCAST:-0}
      # Referral rewards are constrained to explicit turn:invitee targets. This
      # prevents a worker restart from sweeping historical attributions.
      TYCHE_REFERRAL_REWARD_SETTLEMENT_ENABLED: ${TYCHE_REFERRAL_REWARD_SETTLEMENT_ENABLED:-false}
      TYCHE_REFERRAL_REWARD_SETTLEMENT_INTERVAL_MS: ${TYCHE_REFERRAL_REWARD_SETTLEMENT_INTERVAL_MS:-30000}
      TYCHE_REFERRAL_REWARD_TARGET_ALLOWLIST: ${TYCHE_REFERRAL_REWARD_TARGET_ALLOWLIST:-}
      TOKENOMICS_CORE_PROGRAM_ID: ${TOKENOMICS_CORE_PROGRAM_ID:-BRK6G8Sep66LFREp2nGMLiganfw2nbWe1f8zeAdoP1Fm}
      TOKENOMICS_PROJECTION_TOKEN: ${TOKENOMICS_PROJECTION_TOKEN:-}
      TYCHE_TOKENOMICS_REVENUE_AUTOMATION_ENABLED: ${TYCHE_TOKENOMICS_REVENUE_AUTOMATION_ENABLED:-false}
      TYCHE_TOKENOMICS_FIRST_EPOCH_TURN_ID: ${TYCHE_TOKENOMICS_FIRST_EPOCH_TURN_ID:-}
      TYCHE_TOKENOMICS_REVENUE_AUTOMATION_INTERVAL_MS: ${TYCHE_TOKENOMICS_REVENUE_AUTOMATION_INTERVAL_MS:-30000}
      TYCHE_TOKENOMICS_ARTIFACT_BASE_URL: ${TYCHE_TOKENOMICS_ARTIFACT_BASE_URL:-}
      TYCHE_TOKENOMICS_CALCULATION_CODE_COMMIT: ${TYCHE_TOKENOMICS_CALCULATION_CODE_COMMIT:-}
      TYCHE_TOKENOMICS_RUST_CALCULATOR: ${TYCHE_TOKENOMICS_RUST_CALCULATOR:-/usr/local/bin/tokenomics-calculator}
      TYCHE_TOKENOMICS_EPOCH_PUBLISHER_KEYPAIR: ${TYCHE_TOKENOMICS_EPOCH_PUBLISHER_KEYPAIR:-}
      TYCHE_TOKENOMICS_EPOCH_PUBLISHER_KEYPAIR_PATH: ${TYCHE_TOKENOMICS_EPOCH_PUBLISHER_KEYPAIR_PATH:-}
      TYCHE_API_BASE_URL: ${TYCHE_API_BASE_URL:-http://api:3002}
      TYCHE_ELECTION_TOP_VOTED_FINALISTS: ${TYCHE_ELECTION_TOP_VOTED_FINALISTS:-3}
      TYCHE_ELECTION_RANDOM_FINALISTS: ${TYCHE_ELECTION_RANDOM_FINALISTS:-7}
      LLM_MODE: ${LLM_MODE:-local}
      LLM_BASE_URL: ${LLM_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_MODEL: ${LLM_MODEL:-gemma4:latest}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-180000}
      LLM_SEED: ${LLM_SEED:-7}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-local-openai-compatible}
      LLM_PRIMARY_BASE_URL: ${LLM_PRIMARY_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL:-gemma4:latest}
      LLM_PRIMARY_MODEL_DIGEST: ${LLM_PRIMARY_MODEL_DIGEST:-}
      LLM_PRIMARY_MODEL_QUANTIZATION: ${LLM_PRIMARY_MODEL_QUANTIZATION:-q4_K_M}
      LLM_PRIMARY_SERVING_ENGINE: ${LLM_PRIMARY_SERVING_ENGINE:-ollama}
      LLM_SECONDARY_PROVIDER: ${LLM_SECONDARY_PROVIDER:-openai}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_CONTAINER_BASE_URL:-}
      LLM_SECONDARY_MODEL: ${LLM_SECONDARY_MODEL:-gpt-4.1-mini}
      LLM_SECONDARY_MODEL_DIGEST: ${LLM_SECONDARY_MODEL_DIGEST:-}
      LLM_SECONDARY_MODEL_QUANTIZATION: ${LLM_SECONDARY_MODEL_QUANTIZATION:-}
      LLM_SECONDARY_SERVING_ENGINE: ${LLM_SECONDARY_SERVING_ENGINE:-openai}
      LLM_SECONDARY_LOCAL: ${LLM_SECONDARY_LOCAL:-false}
      LLM_TERTIARY_PROVIDER: ${LLM_TERTIARY_PROVIDER:-anthropic}
      LLM_TERTIARY_BASE_URL: ${LLM_TERTIARY_CONTAINER_BASE_URL:-}
      LLM_TERTIARY_MODEL: ${LLM_TERTIARY_MODEL:-claude-3-5-sonnet}
      LLM_TERTIARY_MODEL_DIGEST: ${LLM_TERTIARY_MODEL_DIGEST:-}
      LLM_TERTIARY_MODEL_QUANTIZATION: ${LLM_TERTIARY_MODEL_QUANTIZATION:-}
      LLM_TERTIARY_SERVING_ENGINE: ${LLM_TERTIARY_SERVING_ENGINE:-anthropic}
      LLM_TERTIARY_LOCAL: ${LLM_TERTIARY_LOCAL:-false}
      LLM_PROVIDER_KEYS: ${LLM_PROVIDER_KEYS:-}
      LLM_MODEL_COMPILE: ${LLM_MODEL_COMPILE:-}
      LLM_MODEL_INTERPRET: ${LLM_MODEL_INTERPRET:-}
      LLM_MODEL_NORMALIZE: ${LLM_MODEL_NORMALIZE:-}
      LLM_MODEL_EXPLAIN: ${LLM_MODEL_EXPLAIN:-}
      LLM_MODEL_REVIEW: ${LLM_MODEL_REVIEW:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_CONTAINER_BASE_URL:-http://host.docker.internal:11434/v1}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - tyche-internal
    ports:
      - "${WORKER_PORT:-3003}:3003"
    volumes:
      - ./apps/worker/src:/app/apps/worker/src
      # Acceptance-round rule prompts are reviewed source material; mount them
      # read-only so worker tests and operators run against the same inputs.
      - ./docs:/app/docs:ro
      - ./deployments:/app/deployments:ro
      - tyche-solana-home:/solana-home:ro

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: tyche-web
    profiles: ["containerized"]
    command: ["pnpm", "--filter", "@tyche/web", "dev"]
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    environment:
      TYCHE_API_PROXY_TARGET: http://api:3002
      TYCHE_WORKER_PROXY_TARGET: http://worker:3003
      NEXT_PUBLIC_TYCHE_API_URL: /__api
      NEXT_PUBLIC_TYCHE_WORKER_URL: /__worker
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tyche-internal
    ports:
      - "${WEB_PORT:-3000}:3000"

  admin:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.node
    container_name: tyche-admin
    command: ["pnpm", "--filter", "@tyche/admin", "dev"]
    profiles: ["containerized"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_TYCHE_API_URL: http://localhost:3002
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - tyche-internal
    ports:
      - "${ADMIN_PORT:-3001}:3001"

  prometheus:
    image: prom/prometheus:v3.8.1
    container_name: tyche-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - tyche-internal
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.4.0
    container_name: tyche-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    networks:
      - tyche-internal
    ports:
      - "${GRAFANA_PORT:-3004}:3000"
    volumes:
      - tyche-grafana-data:/var/lib/grafana

  mailpit:
    image: axllent/mailpit:v1.28.0
    container_name: tyche-mailpit
    profiles: ["mail"]
    networks:
      - tyche-internal
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

networks:
  tyche-internal:
    name: tyche-internal

volumes:
  tyche-postgres-data:
    external: true
    name: tyche-postgres-data
  tyche-redis-data:
    external: true
    name: tyche-redis-data
  tyche-grafana-data:
    name: tyche-grafana-data
  tyche-solana-home:
    external: true
    name: tyche-solana-home
