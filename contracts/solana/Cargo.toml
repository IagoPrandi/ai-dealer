[workspace]
members = [
  "programs/idealer",
  "programs/tokenomics_core",
  "tools/tokenomics-calculator",
]
resolver = "2"

[workspace.dependencies]
anchor-lang = { version = "0.32.1" }
anchor-spl = { version = "0.32.1", features = ["token"] }
solana-sha256-hasher = { version = "2.3.0" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }
