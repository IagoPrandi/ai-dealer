[package]
name = "tokenomics-calculator"
version = "0.1.0"
description = "Independent Rust epoch calculator for Idealer Tokenomics Core"
edition = "2021"

[dependencies]
anchor-lang = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenomics-core = { path = "../../programs/tokenomics_core", features = ["no-entrypoint"] }

[lints]
workspace = true
