[package]
name = "idealer"
version = "0.1.0"
description = "Idealer core devnet program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "idealer"

[features]
default = []
cpi = ["no-entrypoint"]
custom-heap = []
# TEST-ONLY (devnet): enables `reinitialize_global_config_for_migration`, used to
# repair a stale `global_config` whose layout predates the current program. OFF
# by default and MUST stay off for production builds so the instruction is
# excluded from the program entirely.
devnet-test = []
custom-panic = []
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []

[dependencies]
anchor-lang = { workspace = true }
solana-sha256-hasher = { workspace = true }

[dev-dependencies]
solana-account-info = "2.3.0"
solana-client = "2.3.13"
solana-program-error = "2.2.2"
solana-program-test = "2.3.13"
solana-sdk = "2.3.1"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
